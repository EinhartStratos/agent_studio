<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titlebar</title>
  <style>
    :root {
      --titlebar-bg: #24292e;
      --titlebar-border: #000;
      --titlebar-text: #fff;
      --titlebar-hover: #2f363d;
      --titlebar-active: #444d56;
      --titlebar-btn-hover: #888;
      --titlebar-close-hover: #e81123;
    }
    html.light {
      --titlebar-bg: #f5f5f5;
      --titlebar-border: #e0e0e0;
      --titlebar-text: #1a1a1a;
      --titlebar-hover: #e5e5e5;
      --titlebar-active: #d4d4d4;
      --titlebar-btn-hover: #d4d4d4;
      --titlebar-close-hover: #e81123;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 28px; width: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      color: var(--titlebar-text);
      background: var(--titlebar-bg);
      user-select: none;
    }
    #electron-app-title-bar {
      height: 28px;
      width: 100%;
      background: var(--titlebar-bg);
      border-bottom: 1px solid var(--titlebar-border);
      -webkit-app-region: drag;
      display: flex;
      flex-direction: row;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .resize-handle {
      position: absolute;
      top: 0;
      left: 0;
      -webkit-app-region: no-drag;
      background: transparent;
    }
    .resize-handle.resize-handle-top { width: 100%; height: 3px; }
    .resize-handle.resize-handle-left { width: 3px; height: 28px; }
    img.icon {
      height: 16px;
      width: 16px;
      margin: 0 6px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }
    .title {
      font-size: 12px;
      font-weight: 600;
      color: var(--titlebar-text);
      margin: 0 6px;
      -webkit-app-region: no-drag;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 140px;
      flex-shrink: 0;
    }
    #app-menu-bar {
      display: flex;
      -webkit-app-region: no-drag;
      height: 100%;
      flex-shrink: 0;
    }
    .toolbar-button { height: 100%; }
    .toolbar-button > button {
      -webkit-appearance: none;
      border: none;
      box-shadow: none;
      background: transparent;
      border-radius: 0;
      margin: 0;
      padding: 0 10px;
      height: 100%;
      color: var(--titlebar-text);
      font-family: inherit;
      font-size: 12px;
      display: flex;
      align-items: center;
      cursor: default;
    }
    .toolbar-button > button:not(:disabled):hover { background-color: var(--titlebar-hover); color: var(--titlebar-text); }
    .toolbar-button > button:not(:disabled):active { background-color: var(--titlebar-active); }
    .toolbar-button > button .menu-label { pointer-events: none; }
    .status {
      display: flex;
      align-items: center;
      margin-left: auto;
      gap: 6px;
      padding: 0 10px;
      font-size: 12px;
      color: var(--titlebar-text);
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.connected { background: #4caf50; }
    .dot.disconnected { background: #f44336; }
    .window-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }
    .window-controls button {
      -webkit-app-region: no-drag;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      border: none;
      box-shadow: none;
      border-radius: 0;
      color: var(--titlebar-text);
      background-color: transparent;
      transition: background-color 0.25s ease;
      cursor: default;
    }
    .window-controls button:not(:disabled):focus { outline: none; }
    .window-controls button:not(:disabled):hover { background-color: var(--titlebar-btn-hover); color: var(--titlebar-text); }
    .window-controls button:not(:disabled):hover:active { background-color: var(--titlebar-active); transition: none; }
    .window-controls button.window-close:not(:disabled):hover { background-color: var(--titlebar-close-hover); color: #fff; }
    .window-controls button.window-close:not(:disabled):hover:active { background-color: #bf0f1d; }
    .window-controls button svg { fill: currentColor; }
  </style>
</head>
<body>
  <div id="electron-app-title-bar">
    <div class="resize-handle resize-handle-top"></div>
    <div class="resize-handle resize-handle-left"></div>
    <img class="icon" id="logo" src="../config/logo.png" alt="Logo" onerror="this.style.display='none'">
    <div class="title" id="title">Agent Studio</div>

    <div id="app-menu-bar">
      <div class="toolbar-button">
        <button id="menu" type="button">
          <span class="menu-label">菜单</span>
        </button>
      </div>
    </div>

    <div class="status" id="status">
      <span class="dot disconnected" id="dot"></span>
      <span id="text">agent disconnected</span>
    </div>

    <div class="window-controls">
      <button id="min" class="window-control window-minimize" aria-label="最小化" title="最小化">
        <svg aria-hidden="true" version="1.1" width="10" height="10">
          <path d="M 0,5 10,5 10,6 0,6 Z" />
        </svg>
      </button>
      <button id="max" class="window-control window-maximize" aria-label="最大化" title="最大化">
        <svg id="max-icon" aria-hidden="true" version="1.1" width="10" height="10">
          <path d="M 0,0 0,10 10,10 10,0 Z M 1,1 9,1 9,9 1,9 Z" />
        </svg>
      </button>
      <button id="close" class="window-control window-close" aria-label="关闭" title="关闭">
        <svg aria-hidden="true" version="1.1" width="10" height="10">
          <path d="M 0,0 0,0.7 4.3,5 0,9.3 0,10 0.7,10 5,5.7 9.3,10 10,10 10,9.3 5.7,5 10,0.7 10,0 9.3,0 5,4.3 0.7,0 Z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    const titleEl = document.getElementById('title');
    const dotEl = document.getElementById('dot');
    const textEl = document.getElementById('text');
    const logoEl = document.getElementById('logo');
    const maxIcon = document.getElementById('max-icon');
    const maxBtn = document.getElementById('max');
    const api = window.electronAPI;

    const maximizePath = 'M 0,0 0,10 10,10 10,0 Z M 1,1 9,1 9,9 1,9 Z';
    const restorePath = 'm 2,1e-5 0,2 -2,0 0,8 8,0 0,-2 2,0 0,-8 z m 1,1 6,0 0,6 -1,0 0,-5 -5,0 z m -2,2 6,0 0,6 -6,0 z';

    function setMaximized(isMaximized) {
      maxBtn.title = isMaximized ? '还原' : '最大化';
      maxBtn.setAttribute('aria-label', isMaximized ? '还原' : '最大化');
      const path = maxIcon.querySelector('path');
      if (path) path.setAttribute('d', isMaximized ? restorePath : maximizePath);
    }

    function applyTheme(theme) {
      document.documentElement.classList.toggle('light', theme === 'light');
    }

    async function refresh() {
      try {
        const config = await api.getAppConfig();
        applyTheme(config.theme ?? 'dark');
        if (titleEl) titleEl.textContent = config.homepage?.title || 'Agent Studio';
        if (config.logo) {
          const isAbsoluteLogo = config.logo.includes(':\\') || config.logo.startsWith('/') || config.logo.startsWith('\\');
          logoEl.src = isAbsoluteLogo
            ? `file:///${config.logo.replace(/\\/g, '/')}`
            : `../config/${config.logo}`;
        }
      } catch (err) {
        console.error('Failed to load titlebar config:', err);
      }

      try {
        const status = await api.getAgentStatus();
        const connected = !!status.connected;
        dotEl.className = `dot ${connected ? 'connected' : 'disconnected'}`;
        textEl.textContent = connected ? 'agent connected' : 'agent disconnected';
      } catch (err) {
        dotEl.className = 'dot disconnected';
        textEl.textContent = 'agent disconnected';
        console.error('Failed to load agent status:', err);
      }
    }

    document.getElementById('min')?.addEventListener('click', () => api.windowMinimize());
    maxBtn?.addEventListener('click', () => api.windowMaximize());
    document.getElementById('close')?.addEventListener('click', () => api.windowClose());
    document.getElementById('menu')?.addEventListener('click', () => {
      if (api.windowShowMenu) api.windowShowMenu();
    });

    if (api.onMaximizeStateChange) {
      api.onMaximizeStateChange((isMaximized) => setMaximized(isMaximized));
    }

    if (api.onThemeChange) {
      api.onThemeChange((theme) => applyTheme(theme));
    }

    refresh();
    setInterval(refresh, 1000);

    (async () => {
      try {
        const result = await api.windowGetMaximizeState?.();
        if (result && typeof result.isMaximized === 'boolean') setMaximized(result.isMaximized);
      } catch (err) {
        // ignore
      }
    })();
  </script>
</body>
</html>
