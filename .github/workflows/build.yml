name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run build:offline
        continue-on-error: true

      - name: Stage Pi binary
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/out/pi ]; then
            cp third_party/pi/out/pi resources/bin/pi-linux-x64
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package Linux x64
        run: npx electron-builder --linux --x64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifacts
          path: dist/

  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run build:offline
        continue-on-error: true

      - name: Stage Pi binary
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/out/pi ]; then
            cp third_party/pi/out/pi resources/bin/pi-linux-arm64
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package Linux arm64
        run: npx electron-builder --linux --arm64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: dist/

  build-win:
    runs-on: windows-latest
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run build:offline
        continue-on-error: true

      - name: Stage Pi binary
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          if (Test-Path third_party/pi/out/pi.exe) {
            Copy-Item third_party/pi/out/pi.exe resources/bin/pi-win.exe
          }
        shell: powershell

      - name: Build Electron
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/

  build-mac:
    runs-on: macos-latest
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run build:offline
        continue-on-error: true

      - name: Stage Pi binary
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/out/pi ]; then
            cp third_party/pi/out/pi resources/bin/pi-darwin-$(uname -m)
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package macOS
        run: npx electron-builder --mac --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/
