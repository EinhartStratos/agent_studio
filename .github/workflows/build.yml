name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            cp third_party/pi/packages/coding-agent/dist/pi resources/bin/pi-linux-x64
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package Linux x64
        run: npx electron-builder --linux --x64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifacts
          path: dist/

  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            cp third_party/pi/packages/coding-agent/dist/pi resources/bin/pi-linux-arm64
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package Linux arm64
        run: npx electron-builder --linux --arm64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: dist/

  build-win:
    runs-on: windows-latest
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Stage Pi binary and assets
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          if (Test-Path third_party/pi/packages/coding-agent/dist/pi.exe) {
            Copy-Item third_party/pi/packages/coding-agent/dist/pi.exe resources/bin/pi-win.exe
            @('theme','assets','export-html','docs','examples','native') | ForEach-Object {
              $src = "third_party/pi/packages/coding-agent/dist/$_"
              if (Test-Path $src) {
                $dest = "resources/bin/$_"
                if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
                Copy-Item -Recurse -Force $src $dest
              }
            }
          }
        shell: powershell

      - name: Build Electron
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/

  build-mac:
    runs-on: macos-latest
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            cp third_party/pi/packages/coding-agent/dist/pi resources/bin/pi-darwin-$(uname -m)
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package macOS
        run: npx electron-builder --mac --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/
