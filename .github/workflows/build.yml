  build-win:
    runs-on: windows-latest
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Download agent tools
        run: |
          New-Item -ItemType Directory -Force -Path resources/agent-tools | Out-Null
          $FD_VERSION = "10.4.2"
          $RG_VERSION = "15.2.0"
          $tmp = "$env:TEMP\agent-tools-$([System.Guid]::NewGuid().ToString())"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Invoke-WebRequest -Uri "https://github.com/sharkdp/fd/releases/download/v$FD_VERSION/fd-v$FD_VERSION-x86_64-pc-windows-msvc.zip" -OutFile "$tmp\fd.zip"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/ripgrep-$RG_VERSION-x86_64-pc-windows-msvc.zip" -OutFile "$tmp\rg.zip"
          Expand-Archive -Path "$tmp\fd.zip" -DestinationPath "$tmp\fd" -Force
          Expand-Archive -Path "$tmp\rg.zip" -DestinationPath "$tmp\rg" -Force
          Get-ChildItem -Path "$tmp\fd" -Recurse -Filter 'fd.exe' | Select-Object -First 1 | Copy-Item -Destination 'resources/agent-tools/fd.exe' -Force
          Get-ChildItem -Path "$tmp\rg" -Recurse -Filter 'rg.exe' | Select-Object -First 1 | Copy-Item -Destination 'resources/agent-tools/rg.exe' -Force
          Remove-Item -Recurse -Force $tmp
        shell: powershell

      - name: Stage Pi binary and assets
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          if (Test-Path third_party/pi/packages/coding-agent/dist/pi.exe) {
            Copy-Item third_party/pi/packages/coding-agent/dist/pi.exe resources/bin/pi-win.exe
            @('theme','assets','export-html','docs','examples','native') | ForEach-Object {
              $src = "third_party/pi/packages/coding-agent/dist/$_"
              if (Test-Path $src) {
                $dest = "resources/bin/$_"
                if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
                Copy-Item -Recurse -Force $src $dest
              }
            }
            $pkgPath = 'third_party/pi/packages/coding-agent/package.json'
            if (Test-Path $pkgPath) {
              $version = (Get-Content $pkgPath | ConvertFrom-Json).version
              if ($version) { $version | Set-Content 'resources/bin/version' -NoNewline }
            }
          }
        shell: powershell

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Electron
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: win-artifacts
          path: dist/

  build-mac:
    runs-on: macos-latest
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Download agent tools
        run: |
          mkdir -p resources/agent-tools
          FD_VERSION=10.4.2
          RG_VERSION=15.2.0
          UARCH=$(uname -m)
          # GitHub release assets use aarch64 instead of arm64
          ASSET_ARCH=$UARCH
          if [ "$UARCH" = "arm64" ]; then ASSET_ARCH="aarch64"; fi
          TMP=$(mktemp -d)
          cd "$TMP"
          curl -fsSL -o fd.tar.gz "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-${ASSET_ARCH}-apple-darwin.tar.gz"
          curl -fsSL -o rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-${ASSET_ARCH}-apple-darwin.tar.gz"
          tar -xzf fd.tar.gz
          tar -xzf rg.tar.gz
          find . -name 'fd' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          find . -name 'rg' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          chmod +x "${GITHUB_WORKSPACE}/resources/agent-tools/fd" "${GITHUB_WORKSPACE}/resources/agent-tools/rg"
          rm -rf "$TMP"
        shell: bash

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            UARCH=$(uname -m)
            NODE_ARCH=$UARCH
            if [ "$UARCH" = "arm64" ]; then NODE_ARCH="arm64"; fi
            if [ "$UARCH" = "x86_64" ]; then NODE_ARCH="x64"; fi
            cp third_party/pi/packages/coding-agent/dist/pi "resources/bin/pi-darwin-${NODE_ARCH}"
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
            node -e "try { const v=require('./third_party/pi/packages/coding-agent/package.json').version; if(v) require('fs').writeFileSync('resources/bin/version', v); } catch {}" 2>/dev/null
          fi
        shell: bash

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Electron
        run: npm run build

      - name: Package macOS
        run: npx electron-builder --mac --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac-artifacts
          path: dist/

  build-mac-x64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Download agent tools
        run: |
          mkdir -p resources/agent-tools
          # fd 10.4.1+ no longer ships x86_64-apple-darwin binaries, fall back to 10.3.0 on Intel Mac
          FD_VERSION=10.4.2
          RG_VERSION=15.2.0
          UARCH=$(uname -m)
          ASSET_ARCH=$UARCH
          if [ "$UARCH" = "arm64" ]; then ASSET_ARCH="aarch64"; fi
          if [ "$UARCH" = "x86_64" ]; then FD_VERSION=10.3.0; fi
          TMP=$(mktemp -d)
          cd "$TMP"
          echo "Downloading fd v${FD_VERSION} (${ASSET_ARCH}-apple-darwin)"
          curl -fsSL -o fd.tar.gz "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-${ASSET_ARCH}-apple-darwin.tar.gz"
          echo "Downloading rg ${RG_VERSION} (${ASSET_ARCH}-apple-darwin)"
          curl -fsSL -o rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-${ASSET_ARCH}-apple-darwin.tar.gz"
          tar -xzf fd.tar.gz
          tar -xzf rg.tar.gz
          find . -name 'fd' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          find . -name 'rg' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          chmod +x "${GITHUB_WORKSPACE}/resources/agent-tools/fd" "${GITHUB_WORKSPACE}/resources/agent-tools/rg"
          rm -rf "$TMP"
        shell: bash

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            UARCH=$(uname -m)
            NODE_ARCH=$UARCH
            if [ "$UARCH" = "arm64" ]; then NODE_ARCH="arm64"; fi
            if [ "$UARCH" = "x86_64" ]; then NODE_ARCH="x64"; fi
            cp third_party/pi/packages/coding-agent/dist/pi "resources/bin/pi-darwin-${NODE_ARCH}"
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
            node -e "try { const v=require('./third_party/pi/packages/coding-agent/package.json').version; if(v) require('fs').writeFileSync('resources/bin/version', v); } catch {}" 2>/dev/null
          fi
        shell: bash

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Electron
        run: npm run build

      - name: Package macOS x64
        run: npx electron-builder --mac --x64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac-x64-artifacts
          path: dist/

  verify-linux-glibc:
    runs-on: ubuntu-22.04
    needs: build-linux-x64
    container:
      image: rockylinux/rockylinux:8
    steps:
      - name: Install tools
        run: dnf install -y binutils tar gzip findutils file

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-x64-artifacts
          path: dist/

      - name: Check GLIBC <= 2.28
        run: |
          cd dist/linux-unpacked
          echo "Checking GLIBC symbol versions for $PWD"
          fail=0
          check_file() {
            local f="$1"
            if [ ! -f "$f" ]; then return; fi
            # Only check ELF files (skip scripts/text).
            if ! file -b "$f" 2>/dev/null | grep -q ELF; then
              return
            fi
            echo "  -> $f"
            if objdump -T "$f" 2>/dev/null | grep -E 'GLIBC_2\.(29|3[0-9])' >/dev/null; then
              echo "ERROR: $f requires GLIBC > 2.28" >&2
              fail=1
            fi
          }
          # Recursively check all native module (.node) and shared library files.
          while IFS= read -r -d '' f; do
            check_file "$f"
          done < <(find . -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.node' \) -print0)
          # Also check any executable ELF files under resources/ (binaries, agent tools).
          while IFS= read -r -d '' f; do
            check_file "$f"
          done < <(find resources -type f -perm /111 -print0)
          if [ "$fail" -ne 0 ]; then
            echo "GLIBC compatibility check failed." >&2
            exit 1
          fi
          echo "All checked binaries are compatible with GLIBC 2.28"
        shell: bash
