name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Download agent tools
        run: |
          mkdir -p resources/agent-tools
          FD_VERSION=10.4.2
          RG_VERSION=15.2.0
          TMP=$(mktemp -d)
          cd "$TMP"
          curl -fsSL -o fd.tar.gz "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf fd.tar.gz
          tar -xzf rg.tar.gz
          find . -name 'fd' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          find . -name 'rg' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          chmod +x "${GITHUB_WORKSPACE}/resources/agent-tools/fd" "${GITHUB_WORKSPACE}/resources/agent-tools/rg"
          rm -rf "$TMP"
        shell: bash

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            cp third_party/pi/packages/coding-agent/dist/pi resources/bin/pi-linux-x64
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package Linux x64
        run: npx electron-builder --linux --x64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifacts
          path: dist/

  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Download agent tools
        run: |
          mkdir -p resources/agent-tools
          FD_VERSION=10.4.2
          RG_VERSION=15.2.0
          TMP=$(mktemp -d)
          cd "$TMP"
          curl -fsSL -o fd.tar.gz "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-aarch64-unknown-linux-musl.tar.gz"
          curl -fsSL -o rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-aarch64-unknown-linux-musl.tar.gz"
          tar -xzf fd.tar.gz
          tar -xzf rg.tar.gz
          find . -name 'fd' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          find . -name 'rg' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          chmod +x "${GITHUB_WORKSPACE}/resources/agent-tools/fd" "${GITHUB_WORKSPACE}/resources/agent-tools/rg"
          rm -rf "$TMP"
        shell: bash

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            cp third_party/pi/packages/coding-agent/dist/pi resources/bin/pi-linux-arm64
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package Linux arm64
        run: npx electron-builder --linux --arm64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: dist/

  build-win:
    runs-on: windows-latest
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Download agent tools
        run: |
          New-Item -ItemType Directory -Force -Path resources/agent-tools | Out-Null
          $FD_VERSION = "10.4.2"
          $RG_VERSION = "15.2.0"
          $tmp = "$env:TEMP\agent-tools-$([System.Guid]::NewGuid().ToString())"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Invoke-WebRequest -Uri "https://github.com/sharkdp/fd/releases/download/v$FD_VERSION/fd-v$FD_VERSION-x86_64-pc-windows-msvc.zip" -OutFile "$tmp\fd.zip"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/ripgrep-$RG_VERSION-x86_64-pc-windows-msvc.zip" -OutFile "$tmp\rg.zip"
          Expand-Archive -Path "$tmp\fd.zip" -DestinationPath "$tmp\fd" -Force
          Expand-Archive -Path "$tmp\rg.zip" -DestinationPath "$tmp\rg" -Force
          Get-ChildItem -Path "$tmp\fd" -Recurse -Filter 'fd.exe' | Select-Object -First 1 | Copy-Item -Destination 'resources/agent-tools/fd.exe' -Force
          Get-ChildItem -Path "$tmp\rg" -Recurse -Filter 'rg.exe' | Select-Object -First 1 | Copy-Item -Destination 'resources/agent-tools/rg.exe' -Force
          Remove-Item -Recurse -Force $tmp
        shell: powershell

      - name: Stage Pi binary and assets
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          if (Test-Path third_party/pi/packages/coding-agent/dist/pi.exe) {
            Copy-Item third_party/pi/packages/coding-agent/dist/pi.exe resources/bin/pi-win.exe
            @('theme','assets','export-html','docs','examples','native') | ForEach-Object {
              $src = "third_party/pi/packages/coding-agent/dist/$_"
              if (Test-Path $src) {
                $dest = "resources/bin/$_"
                if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
                Copy-Item -Recurse -Force $src $dest
              }
            }
          }
        shell: powershell

      - name: Build Electron
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/

  build-mac:
    runs-on: macos-latest
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Download agent tools
        run: |
          mkdir -p resources/agent-tools
          FD_VERSION=10.4.2
          RG_VERSION=15.2.0
          ARCH=$(uname -m)
          TMP=$(mktemp -d)
          cd "$TMP"
          curl -fsSL -o fd.tar.gz "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-${ARCH}-apple-darwin.tar.gz"
          curl -fsSL -o rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-${ARCH}-apple-darwin.tar.gz"
          tar -xzf fd.tar.gz
          tar -xzf rg.tar.gz
          find . -name 'fd' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          find . -name 'rg' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          chmod +x "${GITHUB_WORKSPACE}/resources/agent-tools/fd" "${GITHUB_WORKSPACE}/resources/agent-tools/rg"
          rm -rf "$TMP"
        shell: bash

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            cp third_party/pi/packages/coding-agent/dist/pi resources/bin/pi-darwin-$(uname -m)
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
          fi
        shell: bash

      - name: Build Electron
        run: npm run build

      - name: Package macOS
        run: npx electron-builder --mac --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: dist/
