name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    container:
      image: rockylinux/rockylinux:8
      options: --user root
    environment: ci
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      # Build native modules from source so we control the glibc version.
      npm_config_build_from_source: "true"
      npm_config_python: /usr/bin/python3.9
      PYTHON: /usr/bin/python3.9
      # Run the AppImage tooling without FUSE (containers lack /dev/fuse).
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=0 \
            gcc-toolset-12-gcc-c++ gcc-toolset-12-binutils gcc-toolset-12-runtime \
            make git openssh-clients ca-certificates python39 \
            tar gzip unzip curl findutils which file fuse-libs libzstd
          echo "/opt/rh/gcc-toolset-12/root/usr/bin" >> $GITHUB_PATH
          echo "CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc" >> $GITHUB_ENV
          echo "CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++" >> $GITHUB_ENV
          echo "AR=/opt/rh/gcc-toolset-12/root/usr/bin/ar" >> $GITHUB_ENV
        shell: bash

      - name: Use HTTPS for git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        shell: bash

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install and build Pi submodule
        working-directory: third_party/pi
        run: |
          npm install --ignore-scripts
          npm run hydrate:model-data
          cd packages/coding-agent
          bun run build:binary
        continue-on-error: true

      - name: Download agent tools
        run: |
          mkdir -p resources/agent-tools
          FD_VERSION=10.4.2
          RG_VERSION=15.2.0
          TMP=$(mktemp -d)
          cd "$TMP"
          curl -fsSL -o fd.tar.gz "https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o rg.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf fd.tar.gz
          tar -xzf rg.tar.gz
          find . -name 'fd' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          find . -name 'rg' -type f -exec cp {} "${GITHUB_WORKSPACE}/resources/agent-tools/" \;
          chmod +x "${GITHUB_WORKSPACE}/resources/agent-tools/fd" "${GITHUB_WORKSPACE}/resources/agent-tools/rg"
          rm -rf "$TMP"
        shell: bash

      - name: Stage Pi binary and assets
        run: |
          mkdir -p resources/bin
          if [ -f third_party/pi/packages/coding-agent/dist/pi ]; then
            cp third_party/pi/packages/coding-agent/dist/pi resources/bin/pi-linux-x64
            for dir in theme assets export-html docs examples native; do
              if [ -d "third_party/pi/packages/coding-agent/dist/$dir" ]; then
                rm -rf "resources/bin/$dir"
                cp -r "third_party/pi/packages/coding-agent/dist/$dir" "resources/bin/$dir"
              fi
            done
            node -e "try { const v=require('./third_party/pi/packages/coding-agent/package.json').version; if(v) require('fs').writeFileSync('resources/bin/version', v); } catch {}" 2>/dev/null
          fi
        shell: bash

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Electron
        run: npm run build

      - name: Prune unused clipboard native binaries
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=x64 ;;
            aarch64) ARCH=arm64 ;;
          esac
          find node_modules -type d -path '*/@mariozechner/clipboard-*' -print0 | while IFS= read -r -d '' dir; do
            name=$(basename "$dir")
            case "$name" in
              clipboard-linux-${ARCH}-gnu) ;;
              *) rm -rf "$dir" ;;
            esac
          done
        shell: bash

      - name: Package Linux x64
        run: npx electron-builder --linux --x64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-artifacts
          path: dist/

  build-linux-arm64:
