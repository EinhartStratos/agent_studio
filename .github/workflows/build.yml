          esac
          find node_modules -type d -path '*/@mariozechner/clipboard-*' -print0 | while IFS= read -r -d '' dir; do
            name=$(basename "$dir")
            case "$name" in
              clipboard-linux-${ARCH}-gnu) ;;
              *) rm -rf "$dir" ;;
            esac
          done
        shell: bash

      - name: Package Linux arm64
        run: npx electron-builder --linux --arm64 --publish onTag

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
